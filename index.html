  <style>

    .selection::before,

      height: 38px;

      border-radius: 8px;
      background: #f6f6f8;

    .range-control::-moz-range-track {

      -webkit-mask-position: center;

      -webkit-mask-size: contain;
      mask-size: contain;

    .sticker-img {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .sticker-grid > .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid transparent;
      min-width: 0;
      min-height: 0;
    }
    .sticker-grid > .tile.active { border-color: #ff1687; }
    .sticker-grid > .sticker-import { flex-direction: column; }
    .sticker-grid > .tile[aria-busy="true"] { position: relative; }
    .sticker-grid > .tile[aria-busy="true"]::after {
      content: "";

      width: 14px;
      height: 14px;
      border: 2px solid #dedee4;
      border-top-color: #96969b;
      border-radius: 50%;

    @keyframes sticker-loading { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {

    .color-popover {

      left: 50%;
      top: 50%;

    .color-target {

    .color-cross {

      height: 14px;
    }

    .color-cross::before,
    .color-cross::after {

    .color-cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
    .color-cross::after { left: 0; top: 6px; width: 14px; height: 2px; }

    .native-color {

    .color-popover input[type="range"] {

    .hue-range {

    .popover-actions {

    .popover-actions button:last-child {

    }

    .modal-action {
      display: flex;

      align-items: center;
      gap: 18px;

    }
    .modal-action .modal-icon { position: absolute; left: 78px; top: 13px; margin: 0 !important; }
    .modal-action .modal-label { position: absolute; left: 111px; top: 12px; width: 108px; margin: 0 !important; }
    .modal-action .modal-badge { position: absolute; left: 239px; top: 15px; margin: 0 !important; }
    .modal-action.edit .modal-label { left: 0; width: 100%; }

    .modal-action.note {

    }

    .modal-action .modal-icon {

    }

    .modal-action .modal-label {

    .upload-title {

    .soft {

    .tile {

      background: #fff0f8;

    .modal {

      position: fixed;

    .sheet {
      width: min(100vw - 16px, 374px);
      height: min(84vh, 710px);
      border-radius: 35px 35px 0 0;

      position: relative;

    .picker-tabs { display: flex; background: #e5e5e9; border-radius: 8px; padding: 3px; margin-bottom: 16px; }
    .picker-tabs button { flex: 1; height: 34px; background: transparent; border-radius: 6px; font-size: 14px; }
    .picker-tabs button.active { background: #fff; }
    .picker-grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(10, 23px); border-radius: 8px; overflow: hidden; }

  <script>
    const FIGMA = {
      fileKey: "yoTTC6Cs6jEJHyRaSgIyDq",
      sourceNode: "167:57",
      frames: {
        text: { id: "7663:3755", name: "文字", size: [390, 1010], panelHeight: 463, panelY: 437 },
        symbol: { id: "7663:3829", name: "符号", size: [390, 844], panelHeight: 407, panelY: 437 },
        sticker: { id: "7663:3907", name: "贴纸", size: [390, 844], panelHeight: 407, panelY: 437 },
        canvas: { id: "7663:4150", name: "画布", size: [390, 952], panelHeight: 515, panelY: 437 },
        modal: { id: "7663:4000", name: "弹窗", size: [390, 844] }

      const right = clamp(centerX + halfWidth, metrics.x + 22, metrics.x + metrics.w - 22);

      const bottom = clamp(centerY + halfHeight, metrics.y + 22, metrics.y + metrics.h - 22);
      return {
        rotate: { x: right, y: top },
        scale: { x: right, y: bottom },
        flip: { x: left, y: bottom },
        copy: { x: left, y: top }
      };
    }

    function duplicateSticker(sticker, metrics) {
      const copy = Object.assign({}, sticker, { id: state.nextStickerId++ });
      const pos = stickerPosition(sticker, metrics);
      copy.gx += (pos.x + 16 > metrics.x + metrics.w - 16 ? -16 : 16) / metrics.w;
      copy.gy += (pos.y + 16 > metrics.y + metrics.h - 16 ? -16 : 16) / metrics.w;
      state.stickers.push(copy);
      state.activeStickerId = copy.id;
      return copy;
    }

    function bindStickerCanvasGestures(scene, metrics) {
      scene.style.touchAction = "none";
      const pointers = new Map();
      let session = null;
      let start = null;
      const distance = () => {
        const points = Array.from(pointers.values());
        return points.length > 1 ? Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y) : 0;
      };
      const selected = () => session && state.stickers.find(item => item.id === session.id);
      const reset = () => {
        const point = Array.from(pointers.values())[0];
        const sticker = selected();
        start = { x: point.x, y: point.y, distance: distance(), scale: sticker ? sticker.scale : 1, gx: sticker ? sticker.gx : 0, gy: sticker ? sticker.gy : 0 };
      };
      scene.onpointerdown = event => {
        if (event.target.closest(".sticker-handle")) return;
        const box = scene.getBoundingClientRect();
        const screenScale = box.width / 390;
        const x = (event.clientX - box.left) / screenScale, y = (event.clientY - box.top) / screenScale;
        if (x < metrics.x || x > metrics.x + metrics.w || y < metrics.y || y > metrics.y + metrics.h) return;
        event.preventDefault();
        if (!session) {
          const hit = event.target.closest("[data-sticker-id]");
          if (hit) state.activeStickerId = Number(hit.dataset.stickerId);
          session = { id: state.activeStickerId, move: !!hit, dragging: false, pinched: false, changed: false, before: snapshotState() };
        }
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (scene.setPointerCapture) scene.setPointerCapture(event.pointerId);
        if (pointers.size > 1) session.pinched = true;
        reset();
      };
      scene.onpointermove = event => {
        if (!pointers.has(event.pointerId)) return;
        event.preventDefault();
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        const sticker = selected();
        if (!sticker) return;
        if (pointers.size > 1) {
          sticker.scale = Math.max(0.02, start.scale * distance() / Math.max(1, start.distance));
          session.changed = true;
        } else if (!session.pinched && (session.move || session.dragging || Math.hypot(event.clientX - start.x, event.clientY - start.y) >= 6)) {
          session.dragging = true;
          const screenScale = scene.getBoundingClientRect().width / 390;
          sticker.gx = start.gx + (event.clientX - start.x) / screenScale / metrics.w;
          sticker.gy = start.gy + (event.clientY - start.y) / screenScale / metrics.w;
          session.changed = true;
        }
        updateStickerElement(sticker, metrics);
      };
      const end = event => {
        if (!pointers.has(event.pointerId)) return;
        pointers.delete(event.pointerId);
        if (pointers.size) { reset(); return; }
        if (event.type !== "pointercancel" && !session.move && !session.dragging && !session.pinched) state.activeStickerId = null;
        if (session.changed && session.before !== snapshotState()) {
          history.past.push(session.before);
          history.future = [];
        }
        session = null;
        render();
      };
      scene.onpointerup = scene.onpointercancel = end;
    }

    function normalizeSticker(sticker, metrics) {
      if (typeof sticker.gx === "number" && typeof sticker.gy === "number") return;
      const anchor = stickerAnchor(metrics);
      const x = typeof sticker.rx === "number" ? metrics.x + sticker.rx * metrics.w : sticker.x;
      const y = typeof sticker.ry === "number" ? metrics.y + sticker.ry * metrics.h : sticker.y;
      sticker.gx = ((x || anchor.x) - anchor.x) / metrics.w;
      sticker.gy = ((y || anchor.y) - anchor.y) / metrics.w;
      sticker.baseW = sticker.w || 58;
      sticker.baseH = sticker.h || 58;
    }

    function stickerPosition(sticker, metrics) {
      const scale = metrics.w / FIGMA.canvasRect.w;
      const anchor = stickerAnchor(metrics);
      return {
        x: anchor.x + sticker.gx * metrics.w,
        y: anchor.y + sticker.gy * metrics.w,
        w: (sticker.baseW || sticker.w || 58) * scale,
        h: (sticker.baseH || sticker.h || 58) * scale
      };
    }

    function stickerAnchor(metrics) {
      const ratioTop = {
        "1:1": 0.264,
        "3:4": 0.299,
        "9:16": 0.337
      }[state.ratio];
      return {
        x: metrics.x + metrics.w / 2,
        y: metrics.y + metrics.h / 2 - (0.5 - 0.264) * metrics.w
      };
    }

    function startStickerGesture(event, id, mode, metrics) {
      const sticker = state.stickers.find(item => item.id === id);
      if (!sticker) return;
      state.activeStickerId = id;
      event.preventDefault();
      const rectBox = frame.querySelector(`[data-sticker-id="${id}"]`).getBoundingClientRect();
      const gesture = mode;
      const start = {
        x: event.clientX,
        y: event.clientY,
        stickerX: stickerPosition(sticker, metrics).x,
        stickerY: stickerPosition(sticker, metrics).y,
        scale: sticker.scale,
        rotation: sticker.rotation,
        centerX: rectBox.left + rectBox.width / 2,
        centerY: rectBox.top + rectBox.height / 2,
        snapshot: snapshotState()
      };
      event.currentTarget.setPointerCapture(event.pointerId);
      const move = e => {
        if (gesture === "move") {
          const scene = document.getElementById("previewScene");
          const screenScale = scene.getBoundingClientRect().width / 390;
          const x = start.stickerX + (e.clientX - start.x) / screenScale;
          const y = start.stickerY + (e.clientY - start.y) / screenScale;
          const anchor = stickerAnchor(metrics);
          sticker.gx = (x - anchor.x) / metrics.w;
          sticker.gy = (y - anchor.y) / metrics.w;
        } else if (gesture === "scale") {
          const dist0 = Math.hypot(start.x - start.centerX, start.y - start.centerY) || 1;
          const dist = Math.hypot(e.clientX - start.centerX, e.clientY - start.centerY);
          sticker.scale = Math.max(0.02, start.scale * (dist / dist0));
        } else {
          const a0 = Math.atan2(start.y - start.centerY, start.x - start.centerX);
          const a1 = Math.atan2(e.clientY - start.centerY, e.clientX - start.centerX);
          sticker.rotation = start.rotation + (a1 - a0) * 180 / Math.PI;
        }
        updateStickerElement(sticker, metrics);
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        const after = snapshotState();
        if (start.snapshot !== after) {
          history.past.push(start.snapshot);
          history.future = [];
        }
        render();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up, { once: true });
      window.addEventListener("pointercancel", up, { once: true });
    }

    function updateStickerElement(sticker, metrics = canvasMetrics()) {
      const el = frame.querySelector(`[data-sticker-id="${sticker.id}"]`);
      if (!el) return;
      const pos = stickerPosition(sticker, metrics);
      el.style.setProperty("--x", `${pos.x}px`);
      el.style.setProperty("--y", `${pos.y}px`);
      el.style.setProperty("--w", `${pos.w}px`);
      el.style.setProperty("--h", `${pos.h}px`);
      el.style.setProperty("--scale", sticker.scale);
      el.style.setProperty("--rot", `${sticker.rotation}deg`);
      el.style.setProperty("--selection-line", `${1 / sticker.scale}px`);
      el.style.setProperty("--selection-dot", `${7 / sticker.scale}px`);
      el.style.setProperty("--selection-dot-offset", `${-3.5 / sticker.scale}px`);
      el.querySelector("img").style.transform = sticker.flipX ? "scaleX(-1)" : "";
      const controls = frame.querySelector(`[data-sticker-controls="${sticker.id}"]`);
      if (controls) {
        const positions = stickerHandlePositions(sticker, metrics);
        ["rotate", "scale", "flip", "copy"].forEach(mode => {
          const handle = controls.querySelector(`.${mode}`);
          handle.style.left = `${positions[mode].x}px`;
          handle.style.top = `${positions[mode].y}px`;
        });
      }
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function renderTextPanel() {
      frame.appendChild(txt({ x: 32, y: 505, w: 48, h: 17, id: "7663:3787" }, "输入文字", "fig-text", { fs: 12, color: "#96969b" }));

      input.value = state.text;
      let composing = false;
      let compositionBefore = null;
      input.oncompositionstart = () => { composing = true; compositionBefore = snapshotState(); };
      const updateInput = (e, committed = false) => {
        const raw = e.target.value;
        const explicitCommit = e.inputType === "insertFromComposition" ||
          (e.isComposing === false && e.inputType === "insertText");
        if (!committed && !explicitCommit && (composing || e.isComposing)) {
          if (compositionBefore === null) compositionBefore = snapshotState();
          composing = true;
          // Latin pre-edit text is safe to preview without rewriting the IME's input buffer.
          if (cleanMainText(raw) === raw) {
            state.text = raw;
            renderArtworkOnly();
          }
          return;

        composing = false;
        const before = compositionBefore || snapshotState();
        const cleaned = cleanMainText(raw);
        if (cleaned !== raw) toast(/[\u3400-\u9fff\uf900-\ufaff]/.test(raw) ? "无法输入中文" : "仅支持英文字母、数字和标点符号");
        state.text = cleaned;
        if (input.value !== cleaned) input.value = cleaned;
        if (before !== snapshotState()) {
          history.past.push(before);
          history.future = [];
        }
        compositionBefore = null;
        renderArtworkOnly();
      };
      input.oninput = updateInput;
      input.oncompositionend = e => updateInput(e, true);
      input.onchange = e => updateInput(e, true);

    function addSticker(src) {

      const stickerX = metrics.x + rx * metrics.w;
      const stickerY = metrics.y + ry * metrics.h;
      const sticker = {
        id: state.nextStickerId++,
        src,
        gx: (stickerX - anchor.x) / metrics.w,
        gy: (stickerY - anchor.y) / metrics.w,
        baseW: 58,
        baseH: 58,
        scale: 1,
        rotation: 0,
        flipX: false

      if (undo) undo.style.color = history.past.length ? "#161618" : "#b6b6bb";
      if (redo) redo.style.color = history.future.length ? "#161618" : "#b6b6bb";
    }

    function renderModal() {
      modal.classList.toggle("show", state.modalOpen);
      if (!state.modalOpen) return;
      sheet.innerHTML = "";
      sheet.appendChild(rect({ x: 169, y: 15, w: 36, h: 4 }, "abs", "#d1d1d7", 999));
      const close = txt({ x: 340, y: 18, w: 24, h: 24 }, "×", "fig-text", { fs: 28, lh: "24px", color: "#85858b", align: "center" });
      close.onclick = () => { state.modalOpen = false; renderModal(); };
      sheet.appendChild(close);
      const ok = rect({ x: 172, y: 36, w: 30, h: 30 }, "round", "#16c879", 15);
      ok.innerHTML = `<span style="color:#fff;font-size:24px">✓</span>`;
      sheet.appendChild(ok);
      sheet.appendChild(txt({ x: 130, y: 73, w: 115, h: 31 }, "图片已生成", "fig-text", { fs: 23, lh: "31px", fw: 800, color: "#171717", align: "center" }));
      sheet.appendChild(txt({ x: 119, y: 110, w: 136, h: 16 }, "你的专属 I ❤️ 值得被收藏", "fig-text", { fs: 12, lh: "16px", color: "#929298", align: "center" }));
      const metrics = canvasMetrics();
      const previewScale = Math.min(251 / metrics.w, 255 / metrics.h);
      const preview = rect({
        x: 69 + (251 - metrics.w * previewScale) / 2,
        y: 132 + (255 - metrics.h * previewScale) / 2,
        w: metrics.w * previewScale,
        h: metrics.h * previewScale
      }, "abs export-preview", "transparent");
      preview.style.overflow = "hidden";
      preview.style.pointerEvents = "none";
      preview.textContent = "正在生成…";
      preview.style.display = "flex";
      preview.style.alignItems = "center";
      preview.style.justifyContent = "center";
      preview.style.color = "#96969b";
      sheet.appendChild(preview);
      const previewKey = snapshotState();
      prepareMiniToolImage().then(data => {
        if (!state.modalOpen || preview.parentNode !== sheet || snapshotState() !== previewKey) return;
        const image = document.createElement("img");
        image.alt = "生成结果预览";
        image.style.width = "100%";
        image.style.height = "100%";
        image.style.objectFit = "contain";
        image.src = data;
        preview.textContent = "";
        preview.appendChild(image);
      }).catch(error => {
        if (preview.parentNode !== sheet) return;
        preview.textContent = "图片生成失败，请重新导出";
        console.error("Export preview failed", error);
      });
      sheet.appendChild(txt({ x: 154, y: 393, w: 66, h: 15 }, "生成结果预览", "fig-text", { fs: 11, color: "#99999f", align: "center" }));
      const save = rect({ x: 22, y: 426, w: 330, h: 50 }, "round modal-action save", "#171717", 25);
      save.innerHTML = `<svg class="modal-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 16v4h12v-4M12 4v12M8 12l4 4 4-4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><b class="modal-label" style="color:#fff">保存到相册</b>`;
      save.onclick = async () => {
        if (window.xhs && window.xhs.miniTool) { await deliverMiniToolImage("save"); return; }
        if (save.dataset.saving) return;
        save.dataset.saving = "true";
        try {
          const data = await prepareMiniToolImage();
          const binary = atob(data.split(",")[1]);
          const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
          const blob = new Blob([bytes], { type: "image/png" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "i-love-me.png";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          toast("图片已下载");
        } catch (error) {
          console.error("Image export failed", error);
          toast("图片保存失败，请重试");
        } finally {
          delete save.dataset.saving;
        }
      };
      sheet.appendChild(save);
      const note = rect({ x: 22, y: 488, w: 330, h: 50 }, "round modal-action note", "#fff", 25, "1px solid #dedee4");
      note.innerHTML = `<svg class="modal-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 11h10c1.66 0 3 1.27 3 2.82v6.36C20 21.73 18.66 23 17 23H7c-1.66 0-3-1.27-3-2.82v-6.36C4 12.27 5.34 11 7 11Z" stroke="#ff1687" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 18V3M16 7l-4-4-4 4" stroke="#ff1687" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg><b class="modal-label">发布笔记</b><span class="modal-badge">小红书</span>`;
      note.onclick = publishCurrentDesign;
      sheet.appendChild(note);
      const edit = rect({ x: 22, y: 549, w: 330, h: 50 }, "round modal-action edit", "#fff", 25, "1px solid #dedee4");
      edit.innerHTML = `<b class="modal-label">重新编辑</b>`;
      edit.onclick = () => { state.modalOpen = false; renderModal(); };
      sheet.appendChild(edit);
    }

    async function publishCurrentDesign() {
      await deliverMiniToolImage("post");
    }

    async function exportDesignCanvas() {
      return exportNativeDesignCanvas();
    }

    async function exportBrowserDesignCanvas() {
      const metrics = canvasMetrics();
      const assetCache = new Map();
      const dataUrl = async url => {
        if (url.startsWith("data:")) return url;
        if (!assetCache.has(url)) assetCache.set(url, (async () => {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Export asset failed");
          const blob = await response.blob();
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        })());
        return assetCache.get(url);
      };
      const copyNode = async source => {
        const copy = source.cloneNode(false);
        copy.removeAttribute("id");
        copy.removeAttribute("class");
        const computed = getComputedStyle(source);
        for (const property of computed) {
          let value = computed.getPropertyValue(property);
          const urls = [...value.matchAll(/url\(["']?(.*?)["']?\)/g)];
          for (const match of urls) value = value.replace(match[0], `url("${await dataUrl(match[1])}")`);
          copy.style.setProperty(property, value);
        }
        if (source instanceof HTMLImageElement) copy.src = await dataUrl(source.currentSrc || source.src);
        if (source.classList.contains("active")) copy.style.outline = "none";
        for (const child of source.childNodes) {
          if (child.nodeType === Node.TEXT_NODE) copy.appendChild(child.cloneNode());
          else if (child.nodeType === Node.ELEMENT_NODE && !child.classList.contains("sticker-handle")) copy.appendChild(await copyNode(child));
        }
        return copy;
      };
      const root = document.createElement("div");
      root.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
      root.style.cssText = `position:relative;width:${metrics.w}px;height:${metrics.h}px;overflow:hidden;`;
      const font = await dataUrl(new URL("素材包/英文字体-Corben/CooperBlackStd-3.otf", location.href).href);
      const style = document.createElement("style");
      style.textContent = `@font-face{font-family:CooperStdBlack;src:url("${font}");font-weight:900;}`;
      root.appendChild(style);
      const layers = document.createElement("div");
      layers.style.cssText = `position:absolute;left:${-metrics.x}px;top:${-metrics.y}px;`;
      for (const source of document.getElementById("previewScene").querySelectorAll(":scope > .canvas, :scope > .mark-i, :scope > .heart-large, :scope > .mark-me, :scope > .sticker-clip")) {
        const copy = await copyNode(source);
        copy.style.outline = "none";
        layers.appendChild(copy);
      }
      root.appendChild(layers);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="${Math.round(1080 * metrics.h / metrics.w)}" viewBox="0 0 ${metrics.w} ${metrics.h}"><foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(root)}</foreignObject></svg>`;
      const image = new Image();
      image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      await image.decode();
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = Math.round(1080 * metrics.h / metrics.w);
      canvas.getContext("2d").drawImage(image, 0, 0);
      return canvas;
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 1600);
    }

    let settledViewport = null;
    let typingViewport = null;
    let typingScrollTop = 0;
    let typingReleaseTimer;
    let typingElement = null;

    function isTextEntry(element) {
      return element && element.matches('input:not([type="range"]):not([type="file"]):not([type="color"]), textarea, [contenteditable="true"]');
    }

    function keyboardViewportLayout(viewport, visualHeight, editingMainText, innerHeight = visualHeight) {
      const scale = Math.min(viewport.width, 390) / 390;
      const reportedHeight = Math.min(viewport.height, visualHeight || viewport.height, innerHeight || viewport.height);
      const keyboardOpen = !!editingMainText;
      const measuredKeyboard = viewport.height - reportedHeight > 100;
      // Some in-app keyboards overlay the page without resizing either viewport.
      const typingHeight = measuredKeyboard ? reportedHeight - 24 : viewport.height * 0.44;
      const visibleHeight = keyboardOpen ? Math.max(156 * scale, Math.min(reportedHeight, typingHeight)) : viewport.height;
      const height = visibleHeight / scale;
      const normalPreview = Math.min(437, viewport.height / scale * 0.49);
      const previewHeight = keyboardOpen ? Math.max(0, Math.min(normalPreview, height - 156)) : normalPreview;
      return { visibleHeight, height, previewHeight, keyboardOpen };
    }

    function fit() {
      // Reserve space for the field; crop the preview's upper edge without shrinking its controls.
      const viewport = typingViewport || { width: window.innerWidth, height: window.innerHeight };
      if (!typingViewport) settledViewport = viewport;
      const scale = Math.min(viewport.width, 390) / 390;
      const mobile = viewport.width <= 600 || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      const editingMainText = mobile && typingElement && typingElement.matches("input.field");
      const layout = keyboardViewportLayout(viewport, window.visualViewport ? window.visualViewport.height : window.innerHeight, editingMainText, window.innerHeight);
      const visibleHeight = layout.visibleHeight;
      frame.style.transform = `scale(${scale})`;
      const height = layout.height;
      const previewHeight = layout.previewHeight;
      frame.style.height = `${height}px`;
      const pane = frame.querySelector(".preview-pane");
      const scene = document.getElementById("previewScene");
      const editor = frame.querySelector(".editor-pane");
      if (pane && scene && editor) {
        pane.style.height = `${previewHeight}px`;
        const sceneScale = (layout.keyboardOpen ? Math.min(437, viewport.height / scale * 0.49) : previewHeight) / 437;
        scene.style.top = layout.keyboardOpen ? `${previewHeight - 437 * sceneScale}px` : "0px";
        scene.style.left = `${(390 - 390 * sceneScale) / 2}px`;
        scene.style.transform = `scale(${sceneScale})`;
        editor.style.top = `${previewHeight}px`;
        editor.style.height = `${height - previewHeight}px`;
      }
      const app = document.getElementById("app");
      app.style.height = `${visibleHeight}px`;
      app.style.position = editingMainText ? "fixed" : "";
      app.style.top = editingMainText ? "0px" : "";
      app.style.transform = typingViewport && window.visualViewport ? `translateY(${window.visualViewport.offsetTop || 0}px)` : "";
      const notice = document.getElementById("toast");
      if (notice) {
        notice.style.top = editingMainText ? `${(window.visualViewport ? window.visualViewport.offsetTop || 0 : 0) + visibleHeight - 48}px` : "";
        notice.style.bottom = editingMainText ? "auto" : "";
      }
      frame.querySelectorAll("input.field").forEach(input => { input.style.fontSize = `${Math.max(17, 16 / scale)}px`; });
      if (typingViewport && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
      if (typingViewport) {
        app.scrollTop = 0; app.scrollLeft = 0;
        frame.scrollTop = 0; frame.scrollLeft = 0;
      }
      if (layout.keyboardOpen) {
        const scroll = frame.querySelector(".editor-scroll");
        typingScrollTop = 0;
        if (scroll) scroll.scrollTop = 0;
      }
    }

    document.addEventListener("focusin", event => {
      if (!isTextEntry(event.target)) return;
      typingElement = event.target;
      clearTimeout(typingReleaseTimer);
      if (!typingViewport) {
        typingViewport = settledViewport || { width: window.innerWidth, height: window.innerHeight };
        const scroll = frame.querySelector(".editor-scroll");
        typingScrollTop = scroll ? scroll.scrollTop : 0;
      }
      fit();
    });
    document.addEventListener("focusout", () => {
      clearTimeout(typingReleaseTimer);
      typingReleaseTimer = setTimeout(() => {
        if (isTextEntry(document.activeElement)) return;
        typingViewport = null;
        typingElement = null;
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        fit();
      }, 350);
    });
    document.addEventListener("scroll", event => {
      if (typingViewport && event.target.matches && event.target.matches("#app, #frame, .editor-pane")) {
        event.target.scrollTop = 0;
        event.target.scrollLeft = 0;
      }
      if (typingViewport && event.target.classList && event.target.classList.contains("editor-scroll") && event.target.scrollTop !== typingScrollTop) {
        event.target.scrollTop = typingScrollTop;
      }
    }, true);
    window.addEventListener("resize", fit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fit);
      window.visualViewport.addEventListener("scroll", fit);
    }
    STICKER_ASSETS["推荐"].slice(0, 19).forEach(src => {
      const image = new Image();
      image.setAttribute("fetchpriority", "high");
      image.src = src;
    });
    render();
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderArtworkOnly(); fit(); });
  </script>
